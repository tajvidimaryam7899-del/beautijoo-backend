name: Import Beautijoo Backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[backend-import-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout source backend
        uses: actions/checkout@v4
        with:
          repository: tajvidimaryam7899-del/grokrepositorybeautijoo
          ref: main
          path: source
          fetch-depth: 1

      - name: Replace repository contents with exact backend tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name source -exec rm -rf {} +
          cp -a source/backend/. .
          rm -rf source
          test -f package.json
          test -f liara.json
          test -f nest-cli.json
          test -f tsconfig.json
          test -f tsconfig.build.json
          test -d src
          test -f prisma/schema.prisma
          test -f prisma/seed.ts
          test -d prisma/migrations
          rm -rf .github

      - name: Commit exact imported backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import exact Beautijoo backend [backend-import-complete]"
          git push origin HEAD:main
